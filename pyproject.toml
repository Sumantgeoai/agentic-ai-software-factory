[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-software-factory"
version = "0.1.0"
description = "Governed multi-agent software delivery runtime"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.35,<1",
  "pytest>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
