name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src apps/api tests scripts
      - run: pytest -q

  control-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  generated-enterprise-stack:
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        scenario: [leave, complaint, asset]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_enterprise_ci.py ${{ matrix.scenario }}
      - name: Test generated ASP.NET Core backend
        shell: bash
        run: |
          TEST_PROJECT="$(find ".generated-enterprise/${{ matrix.scenario }}/release-workspace/backend" -name '*.Tests.csproj' -print -quit)"
          test -n "$TEST_PROJECT"
          dotnet test "$TEST_PROJECT" --configuration Release --nologo
      - name: Install generated React dependencies
        working-directory: .generated-enterprise/${{ matrix.scenario }}/release-workspace/frontend
        run: npm install
      - name: Audit generated React dependencies
        working-directory: .generated-enterprise/${{ matrix.scenario }}/release-workspace/frontend
        run: npm audit --audit-level=moderate
      - name: Build generated React application
        working-directory: .generated-enterprise/${{ matrix.scenario }}/release-workspace/frontend
        run: npm run build
