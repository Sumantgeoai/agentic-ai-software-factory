name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src apps/api tests scripts
      - run: pytest -q

  control-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  generated-enterprise-stack:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_enterprise_ci.py
      - name: Test generated ASP.NET Core backend
        run: >-
          dotnet test
          .generated-enterprise/release-workspace/backend/LeaveManagement.Tests/LeaveManagement.Tests.csproj
          --configuration Release
          --nologo
      - name: Install generated React dependencies
        working-directory: .generated-enterprise/release-workspace/frontend
        run: npm install
      - name: Build generated React application
        working-directory: .generated-enterprise/release-workspace/frontend
        run: npm run build
